stages:
  - build
  - test
  - verify_runner
  - image
  - security

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
  tags:
    - saas-linux-small-amd64
  interruptible: true
  timeout: 10m
  before_script:
    - |
      if [ -n "${HARBOR_DOCKER_AUTH:-}" ]; then
        echo "ERROR: Harbor credential must be scoped to ci-harbor."
        exit 1
      fi

variables:
  ASTRO_TELEMETRY_DISABLED: "1"
  APP_REVISION: "$CI_COMMIT_SHA"

build_site:
  stage: build
  cache:
    key:
      files:
        - app/package-lock.json
    paths:
      - app/.npm/
  script:
    - cd app
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - app/dist/
    expire_in: 1 week

test_site:
  stage: test
  needs:
    - job: build_site
      artifacts: true
  script:
    - cd app
    - mkdir -p reports
    - |
      node --test \
        --test-reporter=spec \
        --test-reporter=junit \
        --test-reporter-destination=stdout \
        --test-reporter-destination=reports/junit.xml \
        tests/*.test.mjs
    - |
      node --input-type=module <<'NODE'
      import assert from 'node:assert/strict';
      import { readFileSync } from 'node:fs';

      const metadata = JSON.parse(
        readFileSync('dist/version.json', 'utf8')
      );

      assert.equal(metadata.commit, process.env.CI_COMMIT_SHA);
      console.log('PASS: artifact matches commit', metadata.commit);
      NODE
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/reports/junit.xml
    reports:
      junit: app/reports/junit.xml
runner_probe:
  stage: verify_runner
  tags:
    - cv-harbor
  dependencies: []
  variables:
    CI_DENY_TARGET: "172.26.0.3"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - node scripts/ci/runner-probe.mjs
build_images:
  stage: image
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.6-debug@sha256:7ab44d0131c3051b6dea128067e258c7afb5c4815082a93b9cf6c624f2140bf0
    entrypoint: [""]
  tags:
    - cv-harbor
  before_script: []
  timeout: 20m
  needs:
    - job: runner_probe
      artifacts: false
  parallel:
    matrix:
      - BUILD_TARGET:
          - runtime
          - gateway
  environment:
    name: ci-harbor
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - sh scripts/ci/build-image.sh
  artifacts:
    name: "cv-${BUILD_TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - .artifacts/ci/images/$BUILD_TARGET/
    expire_in: 1 week
security_gate:
  stage: security
  image:
    name: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  tags:
    - cv-harbor
  before_script: []
  timeout: 20m
  allow_failure: false
  needs:
    - job: build_images
      artifacts: true
  parallel:
    matrix:
      - BUILD_TARGET:
          - runtime
          - gateway
  environment:
    name: ci-harbor
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  cache:
    key: trivy-0.75.0
    paths:
      - .artifacts/ci/trivy-cache/
  script:
    - sh scripts/ci/scan-image.sh
  artifacts:
    name: "security-${BUILD_TARGET}-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 1 week
    paths:
      - .artifacts/ci/security/$BUILD_TARGET/
