services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    networks: [observability]

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    networks: [observability, web]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    networks: [observability]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    networks: [observability]

  monitoring-access:
    image: ${GATEWAY_DEPLOY_IMAGE:?Set GATEWAY_DEPLOY_IMAGE in .env}
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./infra/nginx/monitoring-access.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9093:9093"
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 50
    networks: [observability, monitoring-local]

networks:
  observability:
    internal: true
  monitoring-local:

secrets:
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
