apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cv-staging
  namespace: argocd
spec:
  description: CV staging workloads

  sourceRepos:
    - https://gitlab.com/levankhiem0000/devopslab-cv-gitops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: cv-staging

  clusterResourceWhitelist: []

  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
