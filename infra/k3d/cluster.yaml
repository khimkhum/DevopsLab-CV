apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: cv-lab

servers: 1
agents: 0

image: rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc

network: cv-harbor-net

kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "6446"

ports:
  - port: "127.0.0.1:18081:80"
    nodeFilters:
      - loadbalancer

volumes:
  - volume: "/mnt/f/Devops_Lab/.secrets/harbor/ca.crt:/etc/rancher/k3s/harbor-ca.crt:ro"
    nodeFilters:
      - server:*

registries:
  config: |
    mirrors:
      "harbor.cv.test:8443":
        endpoint:
          - "https://harbor.cv.test:8443"
    configs:
      "harbor.cv.test:8443":
        tls:
          ca_file: "/etc/rancher/k3s/harbor-ca.crt"

options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
