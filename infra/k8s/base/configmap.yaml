apiVersion: v1
immutable: true
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events { worker_connections 512; }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        server_tokens off;
        sendfile on;
        client_max_body_size 1m;
        keepalive_timeout 15;
        client_body_timeout 10s;
        client_header_timeout 10s;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

            error_page 404 /404.html;
            location = /version.json { expires -1; try_files $uri =404; }
            location = /healthz { access_log off; expires -1; try_files $uri =404; }
            location /_astro/ { expires 1y; try_files $uri =404; }
            location / { try_files $uri $uri/ =404; }
            location ~ /\. { deny all; }
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        }
    }
kind: ConfigMap
metadata:
  name: cv-nginx-v1
  namespace: cv-lab
