apiVersion: v1
kind: ServiceAccount
metadata:
  name: cv-observer
  namespace: cv-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cv-observer
  namespace: cv-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cv-observer
  namespace: cv-lab
subjects:
  - kind: ServiceAccount
    name: cv-observer
    namespace: cv-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cv-observer
