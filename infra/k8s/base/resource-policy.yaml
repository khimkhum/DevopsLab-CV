apiVersion: v1
kind: LimitRange
metadata:
  name: cv-container-limits
  namespace: cv-lab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 500m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 500m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cv-budget
  namespace: cv-lab
spec:
  hard:
    pods: "4"
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: "2"
    limits.memory: 512Mi
    persistentvolumeclaims: "0"
