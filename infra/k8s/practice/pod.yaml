apiVersion: v1
kind: Pod
metadata:
  name: practice-client
  namespace: cv-practice
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  automountServiceAccountToken: false
  imagePullSecrets:
    - name: harbor-pull
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: harbor.cv.test:8443/cv/portfolio@sha256:7d38473f34f52e231ef38e10ec067dab9e2271b54194a35530c1673061346925
      imagePullPolicy: IfNotPresent
      command: ["sleep", "86400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: practice-data
    - name: scratch
      emptyDir:
        medium: Memory
        sizeLimit: 8Mi
