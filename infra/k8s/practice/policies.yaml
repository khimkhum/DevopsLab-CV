apiVersion: v1
kind: Namespace
metadata:
  name: cv-practice
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: cv-practice
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 64Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 300m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: practice-budget
  namespace: cv-practice
spec:
  hard:
    pods: "2"
    requests.cpu: 100m
    requests.memory: 128Mi
    limits.cpu: "1"
    limits.memory: 256Mi
    persistentvolumeclaims: "1"
    requests.storage: 128Mi
