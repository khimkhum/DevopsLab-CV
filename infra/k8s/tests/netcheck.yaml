apiVersion: v1
kind: Pod
metadata:
  name: cv-netcheck
  namespace: cv-lab
  labels:
    app: cv-netcheck
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  imagePullSecrets:
    - name: harbor-pull
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: netcheck
      image: harbor.cv.test:8443/cv/portfolio@sha256:7d38473f34f52e231ef38e10ec067dab9e2271b54194a35530c1673061346925
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 2
        timeoutSeconds: 2
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
